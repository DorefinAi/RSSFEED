# Alternative: self-hosting on a VPS
# Put feed.xml in /var/www/wire-feed, add DNS A record: wire -> server IP
# Then: sudo certbot --nginx -d wire.dorefinai.com
server {
    listen 80;
    server_name wire.dorefinai.com;
    root /var/www/wire-feed;
    charset utf-8;

    location = /feed.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=60";
    }
}
